name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres with pgvector, so tests/sql.test.ts checks the Postgres backend as well as SQLite.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sandbox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sandbox_test
    defaults:
      run:
        working-directory: workstation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No co-author lines
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          git rev-parse -q --verify "${RANGE%%..*}^{commit}" >/dev/null || RANGE="-1 ${GITHUB_SHA}"
          found=$(git log --format=%B $RANGE | grep -iE '^co-authored-by:|^(🤖 )?generated with' || true)
          found="$found$(printf '%s\n%s' "$TITLE" "$BODY" | grep -iE '^co-authored-by:|^(🤖 )?generated with' || true)"
          if [ -n "$found" ]; then echo "Co-author or attribution line found (AGENTS.md forbids these):"; echo "$found"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workstation/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix ../browser-service
      - run: npm test
      - run: npm run build
      - run: npm run build:inpage
      - run: npm run test:e2e
