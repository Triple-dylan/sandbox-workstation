<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css?v=content-6"></head>
<body>
<aside id="rail" aria-label="Workspace navigation">
  <div class="surface-tabs"><button data-surface="canvas" aria-label="Canvas"><span>Canvas</span></button><button data-surface="graph" aria-label="Context graph"><span>Graph</span></button></div>
  <div id="rail-content"></div>
  <div class="rail-account"><button id="identity" title="Switch local sample identity"><span class="avatar">D</span><span id="identity-name">Dylan</span><span class="local-label">Local prototype</span></button></div>
</aside>
<main id="surface" aria-label="Open workspace">
  <div id="grid"></div>
  <div id="world"></div>
  <div id="guides" aria-hidden="true"></div>
</main>
<form id="composer" aria-label="Chat and workspace controls">
  <div id="composer-reveal" hidden></div>
  <textarea id="message" rows="1" placeholder="Message…" aria-label="Message"></textarea>
  <div class="composer-controls"><div class="composer-left"><button type="button" id="add" aria-label="Add a component" title="Add a component">+</button><button type="button" id="agent-target" title="Address the project agent"><span id="agent-label">Agent</span></button><span id="reply-target"></span></div><div class="composer-right"><button type="button" id="zoom-out" aria-label="Zoom out"></button><button type="button" id="zoom-level" title="Reset zoom">100%</button><button type="button" id="zoom-in" aria-label="Zoom in">+</button><button type="button" id="fit" aria-label="Fit all content" title="Fit all content · 0"></button><button type="submit" id="send" aria-label="Send message"></button></div></div>
</form>
<div id="notice" role="status"></div>
<script src="icons.js"></script><script src="viewers.js"></script><script src="spatial.js"></script><script src="app.js"></script>
</body></html>
